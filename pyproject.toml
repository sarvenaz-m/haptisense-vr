[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haptisense-vr"
version = "0.2.1"
description = "Reproducible force, vibrotactile, Unity, and psychophysics research prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Sarvenaz Mahmoudzadeh Khameneh"}
]
keywords = ["haptics", "virtual-reality", "psychophysics", "unity", "healthcare", "surgical-simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering"
]
dependencies = []

[project.urls]
Homepage = "https://sarvenaz-m.github.io/haptisense-vr/"
Repository = "https://github.com/sarvenaz-m/haptisense-vr"
Documentation = "https://github.com/sarvenaz-m/haptisense-vr/tree/main/docs"

[project.scripts]
haptisense = "haptisense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
