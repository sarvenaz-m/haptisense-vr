<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">HaptiSense VR research demonstrator</title>
  <desc id="desc">Abstract force and vibrotactile signal visualization with project title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b2036"/><stop offset="1" stop-color="#153c50"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#52ddd4" stop-opacity=".55"/><stop offset="1" stop-color="#00a6a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1400" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="520" rx="28" fill="url(#grid)"/>
  <circle cx="1110" cy="260" r="300" fill="url(#glow)"/>
  <g transform="translate(1040 260)" fill="none">
    <circle r="172" stroke="#52ddd4" stroke-opacity=".24"/>
    <circle r="123" stroke="#f17463" stroke-opacity=".45"/>
    <circle r="78" stroke="#52ddd4" stroke-width="2" stroke-opacity=".75"/>
    <path d="M-185 18C-130-80-80 105-22-10S74-105 160 8 226 42 270-18" stroke="#52ddd4" stroke-width="4" stroke-linecap="round"/>
    <path d="M-185 49C-116 21-80 74-28 45S74 2 160 44 228 60 270 33" stroke="#f17463" stroke-width="3" stroke-linecap="round"/>
    <circle r="45" fill="#0b2036" stroke="#fff" stroke-opacity=".2"/>
    <text x="0" y="8" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="37" font-style="italic">F</text>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="84" y="108" fill="#52ddd4" font-size="15" font-weight="700" letter-spacing="3">INDEPENDENT RESEARCH DEMONSTRATOR · V0.2</text>
    <text x="82" y="212" fill="#fff" font-size="76" font-weight="780" letter-spacing="-4">HaptiSense VR</text>
    <text x="84" y="273" fill="#b8ccd6" font-size="26">Force · Vibration · Unity · Psychophysics</text>
    <text x="84" y="347" fill="#8fa9b7" font-size="18">From virtual contact to a safe, measurable, perceptible cue.</text>
    <g transform="translate(84 403)">
      <rect width="140" height="39" rx="8" fill="#00a6a6"/><text x="70" y="25" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">13 TESTS PASS</text>
      <rect x="153" width="140" height="39" rx="8" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12"/><text x="223" y="25" text-anchor="middle" fill="#d8e6eb" font-size="13" font-weight="700">500 HZ DEMO</text>
      <rect x="306" width="160" height="39" rx="8" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12"/><text x="386" y="25" text-anchor="middle" fill="#d8e6eb" font-size="13" font-weight="700">3 TISSUE MODES</text>
    </g>
  </g>
</svg>
