name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Check browser JavaScript syntax
        run: |
          node --check docs/assets/haptic-model.js
          node --check docs/assets/psychophysics-data.js
          node --check docs/assets/app.js
          node --check docs/assets/research-model.js
          node --check docs/assets/research-renderer.js
          node --check docs/assets/workbench.js
      - run: python -m unittest discover -s tests -v
      - run: haptisense compare --output /tmp/haptisense-comparison --duration 1.2 --rate 200
      - run: haptisense research --output /tmp/haptisense-research --model sls --protocol hold

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Exercise workbench and responsive layouts
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory docs > /tmp/haptisense-http.log 2>&1 &
          node tools/browser_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: test-results/browser/
